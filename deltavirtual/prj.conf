CONFIG_GPIO=y

# Console on hardware UART (for Renode). The promicro board defaults to
# USB CDC ACM, which the simulator does not provide. Disable the CDC serial
# backend and route console to uart0 via boards/promicro_nrf52840_nrf52840.overlay.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
